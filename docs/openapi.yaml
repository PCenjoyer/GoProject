openapi: 3.1.0
info:
  title: HookForge API
  version: 1.2.0
  description: Защищённая доставка вебхуков с изоляцией организаций и семантикой «как минимум один раз».
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /:
    get:
      security: []
      summary: Панель управления HookForge
      responses:
        "200":
          description: Встроенная графическая панель HookForge
          content:
            text/html:
              schema:
                type: string
  /v1/me:
    get:
      summary: Получить текущую организацию
      responses:
        "200":
          description: Организация и API-ключ, определённые по Bearer-ключу
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /healthz:
    get:
      security: []
      summary: Проверить состояние процесса
      responses:
        "200":
          description: Процесс работает
  /readyz:
    get:
      security: []
      summary: Проверить готовность базы данных
      responses:
        "200":
          description: Сервис готов к работе
        "503":
          description: База данных недоступна
  /v1/endpoints:
    post:
      summary: Создать точку назначения вебхука
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEndpoint"
      responses:
        "201":
          description: Точка создана; секрет подписи возвращается только один раз
          content:
            application/json:
              schema:
                type: object
                required: [endpoint, secret]
                properties:
                  endpoint:
                    $ref: "#/components/schemas/Endpoint"
                  secret:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      summary: Получить список точек назначения
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Список точек назначения
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Endpoint"
  /v1/events:
    post:
      summary: Принять событие и создать доставки
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvent"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "202":
          description: Новое событие надёжно принято
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResult"
        "200":
          description: Для повторного ключа возвращено существующее событие
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResult"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/events/{id}:
    get:
      summary: Получить событие
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Событие
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/deliveries:
    get:
      summary: Получить список доставок
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DeliveryStatus"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Список доставок
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Delivery"
  /v1/deliveries/{id}/replay:
    post:
      summary: Повторить доставку из DLQ
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: Доставка поставлена на повтор
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HookForge API key
      description: Ключ определяет организацию; клиент никогда не передаёт её ID.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Unauthorized:
      description: API-ключ отсутствует или недействителен
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Входные данные не прошли проверку
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Principal:
      type: object
      required: [tenant, api_key]
      properties:
        tenant:
          type: object
          required: [id, slug, name]
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            name:
              type: string
        api_key:
          type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
    CreateEndpoint:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        url:
          type: string
          format: uri
          description: Адрес должен разрешаться только в публичные сетевые адреса.
    Endpoint:
      type: object
      required: [id, name, url, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
          format: uri
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateEvent:
      type: object
      additionalProperties: false
      required: [type, payload, endpoint_ids]
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 120
        payload: {}
        endpoint_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
    Event:
      type: object
      required: [id, idempotency_key, type, payload, created_at]
      properties:
        id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        type:
          type: string
        payload: {}
        created_at:
          type: string
          format: date-time
    EventResult:
      type: object
      required: [event, duplicate]
      properties:
        event:
          $ref: "#/components/schemas/Event"
        duplicate:
          type: boolean
    DeliveryStatus:
      type: string
      enum: [pending, delivering, succeeded, retrying, dead]
    Delivery:
      type: object
      required:
        - id
        - event_id
        - endpoint_id
        - status
        - attempt_count
        - next_attempt_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        endpoint_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        attempt_count:
          type: integer
        next_attempt_at:
          type: string
          format: date-time
        last_status_code:
          type: integer
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
